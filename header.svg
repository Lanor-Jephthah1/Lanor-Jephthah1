<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 220" width="100%" height="100%">
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --grid-color: rgba(0, 0, 0, 0.04);
      --line-color: rgba(37, 99, 235, 0.15);
      --border-color: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0d1117;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --accent: #60a5fa;
        --grid-color: rgba(255, 255, 255, 0.04);
        --line-color: rgba(96, 165, 250, 0.2);
        --border-color: #30363d;
      }
    }
    
    .bg { fill: var(--bg-color); stroke: var(--border-color); stroke-width: 1px; }
    
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: var(--text-main);
      letter-spacing: 1px;
    }
    
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .details {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: var(--text-muted);
      letter-spacing: 1px;
    }
    
    @keyframes slideRight {
      0% { transform: translateX(-50px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(880px); opacity: 0; }
    }
    
    .animated-line {
      stroke: var(--line-color);
      stroke-width: 1.5px;
      stroke-linecap: round;
      animation: slideRight 5s infinite ease-in-out;
    }
  </style>

  <rect width="100%" height="100%" class="bg" rx="8" />

  <defs>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="var(--grid-color)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dotGrid)" rx="8" />

  <!-- Animated Tech Scanning Lines -->
  <line x1="0" y1="40" x2="80" y2="40" class="animated-line" style="animation-delay: 0s;" />
  <line x1="0" y1="180" x2="120" y2="180" class="animated-line" style="animation-delay: 2.5s;" />
  <line x1="0" y1="110" x2="60" y2="110" class="animated-line" style="animation-delay: 1.2s;" />

  <!-- Clean Professional Typography -->
  <g transform="translate(415, 110)">
    <text x="0" y="-20" text-anchor="middle" class="name">JEPHTHAH KWAME LANOR</text>
    <text x="0" y="20" text-anchor="middle" class="title">AI Researcher &amp; BSc Computer Engineer</text>
    <text x="0" y="55" text-anchor="middle" class="details">NATURAL LANGUAGE PROCESSING • LOW-RESOURCE LANGUAGES • FULL-STACK AI</text>
  </g>
</svg>
