          <text x="45" y="22" text-anchor="middle" class="pill-text">QLoRA</text>
        </g>
        <g transform="translate(510, 0)">
          <rect width="130" height="35" rx="17.5" class="pill-rect" />
          <text x="65" y="22" text-anchor="middle" class="pill-text">Hugging Face</text>
        </g>
        <g transform="translate(670, 0)">
          <rect width="120" height="35" rx="17.5" class="pill-rect" />
          <text x="60" y="22" text-anchor="middle" class="pill-text">PostgreSQL</text>
        </g>
        <g transform="translate(820, 0)">
