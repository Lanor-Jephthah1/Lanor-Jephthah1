<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for pills -->
    <linearGradient id="pillBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.15)" />
      <stop offset="100%" stop-color="rgba(79, 172, 254, 0.05)" />
    </linearGradient>
    <linearGradient id="pillBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.15)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.05)" />
    </linearGradient>

    <linearGradient id="pillBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.5)" />
      <stop offset="100%" stop-color="rgba(79, 172, 254, 0.2)" />
    </linearGradient>
    <linearGradient id="pillBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.5)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.2)" />
    </linearGradient>

    <!-- Faded edges for the marquee container -->
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="5%" stop-color="rgba(13, 17, 23, 0)" />
      <stop offset="95%" stop-color="rgba(13, 17, 23, 0)" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;display=swap');

    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes scrollRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .pill-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
      letter-spacing: 1px;
    }

    .track1 {
      animation: scrollLeft 40s linear infinite;
    }

    .track2 {
      animation: scrollRight 45s linear infinite;
    }
  </style>

  <rect width="100%" height="100%" fill="none" />

  <!-- Track 1 (Top Row) moving left -->
  <svg x="0" y="20" width="830" height="45">
    <g class="track1">
      <!-- Original Set -->
      <g transform="translate(0, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">Python</text>
      </g>
      <g transform="translate(110, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">JavaScript</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">PyTorch</text>
      </g>
      <g transform="translate(360, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">QLoRA</text>
      </g>
      <g transform="translate(470, 0)">
        <rect width="140" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="70" y="22" text-anchor="middle" class="pill-text">Hugging Face</text>
      </g>
      <g transform="translate(630, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">PostgreSQL</text>
      </g>
      <g transform="translate(760, 0)">
        <rect width="120" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="60" y="22" text-anchor="middle" class="pill-text">HTML/CSS</text>
      </g>
      <g transform="translate(900, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">MATLAB</text>
      </g>

      <!-- Duplicated Set (starts exactly at width 1050) -->
      <g transform="translate(1050, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">Python</text>
      </g>
      <g transform="translate(1160, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">JavaScript</text>
      </g>
      <g transform="translate(1290, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">PyTorch</text>
      </g>
      <g transform="translate(1410, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">QLoRA</text>
      </g>
      <g transform="translate(1520, 0)">
        <rect width="140" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="70" y="22" text-anchor="middle" class="pill-text">Hugging Face</text>
      </g>
      <g transform="translate(1680, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">PostgreSQL</text>
      </g>
      <g transform="translate(1810, 0)">
        <rect width="120" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="60" y="22" text-anchor="middle" class="pill-text">HTML/CSS</text>
      </g>
      <g transform="translate(1950, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">MATLAB</text>
      </g>
    </g>
  </svg>

  <!-- Track 2 (Bottom Row) moving right -->
  <svg x="0" y="80" width="830" height="45">
    <g class="track2">
      <!-- Original Set -->
      <g transform="translate(0, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">AI Agents</text>
      </g>
      <g transform="translate(130, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">MongoDB</text>
      </g>
      <g transform="translate(250, 0)">
        <rect width="80" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="40" y="22" text-anchor="middle" class="pill-text">AWS</text>
      </g>
      <g transform="translate(350, 0)">
        <rect width="80" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="40" y="22" text-anchor="middle" class="pill-text">Vercel</text>
      </g>
      <g transform="translate(450, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">Firebase</text>
      </g>
      <g transform="translate(570, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">Proteus</text>
      </g>
      <g transform="translate(680, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">AutoCAD</text>
      </g>
      <g transform="translate(800, 0)">
        <rect width="120" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="60" y="22" text-anchor="middle" class="pill-text">Automation</text>
      </g>

      <!-- Duplicated Set starts at 960px width -->
      <g transform="translate(960, 0)">
        <rect width="110" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="55" y="22" text-anchor="middle" class="pill-text">AI Agents</text>
      </g>
      <g transform="translate(1090, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">MongoDB</text>
      </g>
      <g transform="translate(1210, 0)">
        <rect width="80" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="40" y="22" text-anchor="middle" class="pill-text">AWS</text>
      </g>
      <g transform="translate(1310, 0)">
        <rect width="80" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="40" y="22" text-anchor="middle" class="pill-text">Vercel</text>
      </g>
      <g transform="translate(1410, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">Firebase</text>
      </g>
      <g transform="translate(1530, 0)">
        <rect width="90" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="45" y="22" text-anchor="middle" class="pill-text">Proteus</text>
      </g>
      <g transform="translate(1640, 0)">
        <rect width="100" height="35" rx="17.5" fill="url(#pillBg2)" stroke="url(#pillBorder2)" stroke-width="1.2" />
        <text x="50" y="22" text-anchor="middle" class="pill-text">AutoCAD</text>
      </g>
      <g transform="translate(1760, 0)">
        <rect width="120" height="35" rx="17.5" fill="url(#pillBg1)" stroke="url(#pillBorder1)" stroke-width="1.2" />
        <text x="60" y="22" text-anchor="middle" class="pill-text">Automation</text>
      </g>
    </g>
  </svg>

  <!-- Left and Right gradients to fade the marquee edges smoothly into background -->
  <rect x="0" y="0" width="150" height="150" fill="url(#fadeEdge)" />
</svg>
