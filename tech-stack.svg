<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 120" width="100%" height="100%">
  <style>
    :root {
      --text-main: #374151;
      --pill-bg: #f3f4f6;
      --pill-border: #d1d5db;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text-main: #d1d5db;
        --pill-bg: #1f2937;
        --pill-border: #374151;
      }
    }

    @keyframes scrollLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes scrollRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: var(--text-main);
      letter-spacing: 0.5px;
    }
    
    .pill-rect {
      fill: var(--pill-bg);
      stroke: var(--pill-border);
      stroke-width: 1px;
    }

    .track1 { animation: scrollLeft 35s linear infinite; }
    .track2 { animation: scrollRight 40s linear infinite; }
  </style>

  <defs>
    <linearGradient id="fadeMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="5%" stop-color="rgba(255,255,255,1)" />
      <stop offset="95%" stop-color="rgba(255,255,255,1)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <mask id="fadeMask">
      <rect width="100%" height="100%" fill="url(#fadeMaskGrad)" />
    </mask>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <g mask="url(#fadeMask)">
    <!-- Track 1 (Top Row) moving left -->
    <svg x="0" y="10" width="830" height="45">
      <g class="track1">
        <!-- Original Set -->
        <g transform="translate(0, 0)">
          <rect width="90" height="35" rx="17.5" class="pill-rect" />
          <text x="45" y="22" text-anchor="middle" class="pill-text">Python</text>
        </g>
        <g transform="translate(120, 0)">
          <rect width="110" height="35" rx="17.5" class="pill-rect" />
          <text x="55" y="22" text-anchor="middle" class="pill-text">JavaScript</text>
        </g>
        <g transform="translate(260, 0)">
