<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 30" width="100%" height="100%">
  <style>
    :root {
      --base-line: rgba(0, 0, 0, 0.1);
      --dot-color: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --base-line: rgba(255, 255, 255, 0.1);
        --dot-color: #60a5fa;
      }
    }
    @keyframes pingPong {
      0% { transform: translateX(50px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(780px); opacity: 0; }
    }
    .line { stroke: var(--base-line); stroke-width: 1px; stroke-linecap: round; }
    .dot { fill: var(--dot-color); animation: pingPong 4s infinite alternate ease-in-out; }
  </style>
  <line x1="50" y1="15" x2="780" y2="15" class="line" />
  <circle cx="0" cy="15" r="2.5" class="dot" />
</svg>
