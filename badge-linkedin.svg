<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" width="200" height="36">
  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --text: #f9fafb;
        --accent: #60a5fa;
      }
    }
    .rect { fill: var(--bg); stroke: var(--border); stroke-width: 1px; }
    .txt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: var(--text);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .dot { fill: var(--accent); }
  </style>
  <rect width="100%" height="100%" class="rect" rx="6" />
  
  <!-- LinkedIn clean brand icon -->
  <path d="M 28,12 L 40,12 C 42,12 44,14 44,16 L 44,24 L 28,24 Z" fill="none" stroke="var(--accent)" stroke-width="1.5" />
  <path d="M 32,18 L 32,22 M 32,15 A 0.5,0.5 0 1,1 32,14" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 36,18 L 36,22 M 36,18 C 37,18 39,18 39,20 L 39,22" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" />
  
  <text x="56" y="22" class="txt">LinkedIn Connect</text>
  
  <!-- Subtle active signal dot -->
  <circle cx="178" cy="18" r="3" class="dot" />
</svg>
