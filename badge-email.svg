<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" width="200" height="36">
  <style>
    :root {
      --bg: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --border: #30363d;
        --text: #f9fafb;
        --accent: #60a5fa;
      }
    }
    .rect { fill: var(--bg); stroke: var(--border); stroke-width: 1px; }
    .txt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: var(--text);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .dot { fill: var(--accent); }
  </style>
  <rect width="100%" height="100%" class="rect" rx="6" />
  
  <!-- Email Icon (Clean Minimal Mailbox) -->
  <path d="M 28,12 L 44,12 C 45,12 46,13 46,14 L 46,22 C 46,23 45,24 44,24 L 28,24 C 27,24 26,23 26,22 L 26,14 C 26,13 27,12 28,12 Z M 27.5,14 L 35,18.5 L 42.5,14 Z" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="56" y="22" class="txt">Email Contact</text>
  
  <!-- Subtle active signal dot -->
  <circle cx="178" cy="18" r="3" class="dot" />
</svg>
